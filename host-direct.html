<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0b14" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Trick or Trivia — Direct Host Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Creepster&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --orange:#f47b20; --orange-light:#ffad4d; --purple:#9a5cff; --gold:#f6c453; --text:#f6eedb; --muted:#cfc7d9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 15% 0%,rgba(154,92,255,.22),transparent 32rem),radial-gradient(circle at 90% 10%,rgba(244,123,32,.16),transparent 30rem),linear-gradient(180deg,#160d20,#09060d 70%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .loading { display:grid; min-height:100vh; place-items:center; padding:24px; }
    .card { width:min(620px,100%); border:1px solid rgba(154,92,255,.62); border-radius:24px; padding:34px; text-align:center; background:linear-gradient(120deg,rgba(244,123,32,.1),transparent 42%),linear-gradient(180deg,rgba(37,22,49,.98),rgba(17,11,23,.98)); box-shadow:0 28px 80px rgba(0,0,0,.56),inset 0 0 0 5px rgba(9,6,12,.44); }
    .seal { display:grid; width:68px; aspect-ratio:1; place-items:center; margin:0 auto 18px; border:2px solid var(--gold); border-radius:50%; color:var(--gold); background:rgba(246,196,83,.08); font-size:1.8rem; }
    .eyebrow { margin:0 0 5px; color:var(--orange-light); font-family:"Barlow Condensed",Impact,sans-serif; font-size:.82rem; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; color:var(--orange-light); font-family:Creepster,Georgia,serif; font-size:clamp(3.2rem,10vw,5.6rem); font-weight:400; line-height:.9; text-shadow:0 4px 0 #642405; }
    .status { margin:18px 0 0; color:var(--muted); line-height:1.5; }
    .status.error { color:#ff9aa1; }
    iframe { display:block; width:100%; height:100vh; border:0; background:#08060c; }
    [hidden] { display:none!important; }
  </style>
</head>
<body>
  <section id="loading" class="loading">
    <div class="card">
      <div class="seal" aria-hidden="true">★</div>
      <p class="eyebrow">Private Backstage Entrance</p>
      <h1>Host Controls</h1>
      <p id="status" class="status" aria-live="polite">Connecting to the dungeon…</p>
    </div>
  </section>
  <iframe id="hostFrame" title="Trick or Trivia host controls" hidden></iframe>
  <script type="module" src="host-direct.js?v=1"></script>
</body>
</html>
