<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0b14">
<title>Trick or Trivia — Direct Host Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--orange:#ffad4d;--gold:#f6c453;--text:#f6eedb;--muted:#cfc7d9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(154,92,255,.22),transparent 32rem),radial-gradient(circle at 90% 10%,rgba(244,123,32,.16),transparent 30rem),linear-gradient(180deg,#160d20,#09060d 70%);font-family:Inter,system-ui,sans-serif}
.loading{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(620px,100%);border:1px solid rgba(154,92,255,.62);border-radius:24px;padding:34px;text-align:center;background:linear-gradient(180deg,rgba(37,22,49,.98),rgba(17,11,23,.98));box-shadow:0 28px 80px rgba(0,0,0,.56)}
.seal{display:grid;width:68px;aspect-ratio:1;place-items:center;margin:0 auto 18px;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font-size:1.8rem}
.eyebrow{margin:0 0 5px;color:var(--orange);font-family:"Barlow Condensed",Impact,sans-serif;font-size:.82rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;color:var(--orange);font-family:Creepster,Georgia,serif;font-size:clamp(3.2rem,10vw,5.6rem);font-weight:400;line-height:.9;text-shadow:0 4px 0 #642405}
.status{margin:18px 0 0;color:var(--muted);line-height:1.5}.error{color:#ff9aa1}
iframe{display:block;width:100%;height:100vh;border:0;background:#08060c}[hidden]{display:none!important}
</style>
</head>
<body>
<section id="loading" class="loading"><div class="card">
<div class="seal">★</div><p class="eyebrow">Private Backstage Entrance</p><h1>Host Controls</h1>
<p id="status" class="status" aria-live="polite">Connecting to room CARL26 and claiming host controls…</p>
</div></section>
<iframe id="hostFrame" title="Trick or Trivia host controls" hidden></iframe>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import{getDatabase,onDisconnect,ref,set,update}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
import{firebaseConfig,DEFAULT_ROOM_CODE}from"./firebase-config.js";
const room=String(new URLSearchParams(location.search).get("room")||localStorage.getItem("trickOrTriviaRoom")||DEFAULT_ROOM_CODE).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8)||DEFAULT_ROOM_CODE;
const status=document.getElementById("status"),frame=document.getElementById("hostFrame"),loading=document.getElementById("loading");
let opened=false,db=null;
function fail(msg){status.textContent=msg;status.classList.add("error")}
async function openHost(user){
 if(opened||!user)return;opened=true;
 const app=getApps()[0]||initializeApp(firebaseConfig);db=getDatabase(app);const hostRef=ref(db,"rooms/"+room+"/hostUid");
 try{
  localStorage.setItem("trickOrTriviaRoom",room);
  sessionStorage.setItem("trickOrTriviaHostPortal",room);
  sessionStorage.removeItem("trickOrTriviaHostKeyHash");
  await set(hostRef,user.uid);
  try{await onDisconnect(hostRef).remove()}catch{}
  frame.src="./?room="+encodeURIComponent(room)+"&hostPortal=1&build=direct4#host";
  frame.addEventListener("load",installResetButton,{once:false});
  frame.hidden=false;loading.hidden=true;
 }catch(e){opened=false;console.error(e);fail("Firebase is still enforcing the old host-key rules. Publish the updated Realtime Database rules, then reload this page.")}
}
async function resetGameNight(){
 if(!db)return;
 if(!window.confirm("Reset Game Night? This will permanently clear all players, scores, submitted answers, and used questions, and reset the round to 1."))return;
 await update(ref(db),{
  ["rooms/"+room+"/public/round"]:1,
  ["rooms/"+room+"/players"]:null,
  ["rooms/"+room+"/answers"]:null,
  ["rooms/"+room+"/used"]:null,
  ["rooms/"+room+"/game"]:{phase:"board"}
 });
}
function installResetButton(){
 try{
  const doc=frame.contentDocument;
  if(!doc||doc.getElementById("resetGameNight"))return;
  const clear=doc.getElementById("clearPlayers");
  if(!clear)return;
  const btn=doc.createElement("button");
  btn.id="resetGameNight";
  btn.type="button";
  btn.className="button secondary";
  btn.textContent="Reset Game Night";
  btn.addEventListener("click",()=>resetGameNight().catch(e=>{console.error(e);alert("Reset failed: "+(e?.message||"Unknown error"));}));
  clear.insertAdjacentElement("afterend",btn);
 }catch(e){console.error("Could not add Reset Game Night control:",e)}
}
const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app);
onAuthStateChanged(auth,u=>{if(u)openHost(u)});
if(!auth.currentUser)signInAnonymously(auth).catch(e=>fail(e.message||"Could not connect."));
</script>
</body></html>
