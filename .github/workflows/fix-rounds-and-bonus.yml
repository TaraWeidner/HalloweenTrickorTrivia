# One-time maintenance workflow; remove after successful patch.
name: Fix rounds and DCC bonus rotation

on:
  push:
    paths:
      - .github/workflows/fix-rounds-and-bonus.yml

permissions:
  contents: write

jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch live game
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          questions_path = Path('questions-live.js')
          questions = questions_path.read_text()
          old_bonus = '''export const bonus = {
            category: 'Dungeon Crawler Carl',
            value: 1000,
            text: 'What is the name of Princess Donut’s dinosaur companion?',
            choices: ['Mongo','Gravy Boat','Ferdinand','Kiwi'],
            answer: 'Mongo',
            fact: 'Mongo is appalled that anyone might miss this question.'
          };'''
          new_bonus = '''export const bonusQuestions = [
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What breed of cat is Princess Donut?',
              choices: ['Persian', 'Maine Coon', 'Siamese', 'Sphynx'],
              answer: 'Persian',
              fact: 'Princess Donut is a prizewinning Persian cat with a charisma score worthy of royalty.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is the name of Princess Donut’s dinosaur companion?',
              choices: ['Mongo', 'Gravy Boat', 'Ferdinand', 'Kiwi'],
              answer: 'Mongo',
              fact: 'Mongo is Donut’s bonded dinosaur companion and Royal Steed.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Who serves as Carl and Donut’s tutorial guide and later manager?',
              choices: ['Mordecai', 'Prepotente', 'Chaco', 'Florin'],
              answer: 'Mordecai',
              fact: 'Mordecai begins as their dungeon guide and becomes their long-suffering manager.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Before the collapse, Carl served in which branch of the U.S. military?',
              choices: ['Coast Guard', 'Army', 'Navy', 'Air Force'],
              answer: 'Coast Guard',
              fact: 'Carl is a former Coast Guard marine technician.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is the name of Carl’s ex-girlfriend?',
              choices: ['Beatrice', 'Odette', 'Katia', 'Imani'],
              answer: 'Beatrice',
              fact: 'Beatrice—usually called Bea—is Donut’s original owner and Carl’s ex.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Who is Carl and Donut’s original public-relations representative?',
              choices: ['Zev', 'Odette', 'Loita', 'Hekla'],
              answer: 'Zev',
              fact: 'Zev communicates with the crawlers and manages their public image for Borant.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Which intergalactic talk-show host interviews and advises Carl?',
              choices: ['Odette', 'Zev', 'Agatha', 'Elle'],
              answer: 'Odette',
              fact: 'Odette is a powerful media personality with a complicated connection to the crawl.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'How many levels are in Dungeon World: Earth?',
              choices: ['18', '12', '20', '9'],
              answer: '18',
              fact: 'The World Dungeon is built as an eighteen-level survival crawl.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is the name of Carl and Donut’s party?',
              choices: ['Royal Court of Princess Donut', 'The Princess Posse', 'Safehome Yolanda', 'The Meadow Lark Crew'],
              answer: 'Royal Court of Princess Donut',
              fact: 'Naturally, Donut’s adventuring party carries her full royal branding.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is the Floor One borough boss defeated by Carl and his allies?',
              choices: ['Ball of Swine', 'Krakaren', 'Rage Elemental', 'The Butcher'],
              answer: 'Ball of Swine',
              fact: 'The Ball of Swine is the major borough boss confrontation on the first floor.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is Carl’s crawler number?',
              choices: ['4,122', '4,123', '5,000', '18'],
              answer: '4,122',
              fact: 'Carl enters the dungeon as Crawler 4,122.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is Princess Donut’s crawler number?',
              choices: ['4,123', '4,122', '4,124', '5,001'],
              answer: '4,123',
              fact: 'Donut follows Carl into the dungeon and is registered as Crawler 4,123.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Which race does Carl select?',
              choices: ['Primal', 'Human', 'Skyfowl', 'Changeling'],
              answer: 'Primal',
              fact: 'Carl selects the Primal race when race and class choices become available.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Which class does Carl select?',
              choices: ['Compensated Anarchist', 'Monster Truck Driver', 'Former Child Actor', 'Glass Cannon'],
              answer: 'Compensated Anarchist',
              fact: 'Compensated Anarchist is Carl’s appropriately disruptive class.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Which class does Princess Donut initially select?',
              choices: ['Former Child Actor', 'Glass Cannon', 'Viper Queen', 'Bard'],
              answer: 'Former Child Actor',
              fact: 'Donut’s Former Child Actor class pairs beautifully with her enormous charisma.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is Princess Donut’s signature attack spell?',
              choices: ['Magic Missile', 'Laundry Day', 'Protective Shell', 'Puddle Jump'],
              answer: 'Magic Missile',
              fact: 'Donut’s eye-fired Magic Missile becomes one of her signature attacks.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What royal title is given to Mongo?',
              choices: ['Royal Steed', 'Dungeon Prince', 'Grand Champion', 'Royal Bodyguard'],
              answer: 'Royal Steed',
              fact: 'Mongo is formally styled as Princess Donut’s Royal Steed.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What is the fourth dungeon floor called?',
              choices: ['The Iron Tangle', 'The Bubbles', 'The Hunting Grounds', 'Faction Wars'],
              answer: 'The Iron Tangle',
              fact: 'The Iron Tangle is a sprawling and deeply confusing rail network.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'Which corporation operates the Earth crawl at the beginning of the series?',
              choices: ['Borant Corporation', 'Valtay Corporation', 'Open Intellect', 'The Plenty'],
              answer: 'Borant Corporation',
              fact: 'Borant operates and broadcasts Dungeon World: Earth.'
            },
            {
              category: 'Dungeon Crawler Carl', value: 1000,
              text: 'What was Mordecai’s original race?',
              choices: ['Skyfowl', 'Bopca', 'Primal', 'Cretin'],
              answer: 'Skyfowl',
              fact: 'Mordecai is originally a Skyfowl, though his appearance changes throughout the crawl.'
            }
          ];'''
          if old_bonus not in questions:
              raise SystemExit('Could not find the original bonus question block.')
          questions_path.write_text(questions.replace(old_bonus, new_bonus))

          app_path = Path('app-live.js')
          app = app_path.read_text()

          replacements = [
            (
              'import { categories, bonus } from "./questions-live.js";',
              'import { categories, bonusQuestions } from "./questions-live.js";'
            ),
            (
              '''function resolveQuestionFromGame(game) {
            if (!game || game.phase === "board") return null;
            if (game.isBonus) return { ...bonus, key: null, isBonus: true };
            const category = categories[Number(game.categoryIndex)];
            const question = category?.questions?.[Number(game.questionIndex)];
            if (!category || !question) return null;
            const level = Number(game.questionIndex);
            return {
              key: `${game.categoryIndex}-${game.questionIndex}`,
              categoryIndex: Number(game.categoryIndex),
              questionIndex: Number(game.questionIndex),
              category: category.name,
              level,
              value: Number(game.value || (level + 1) * 100),
              text: question[0],
              choices: question[1],
              answer: question[2],
              fact: question[3],
              isBonus: false
            };
          }''',
              '''function resolveQuestionFromGame(game) {
            if (!game || game.phase === "board") return null;
            if (game.isBonus) {
              const bonusIndex = Number(game.questionIndex ?? 0);
              const selectedBonus = bonusQuestions[bonusIndex] || bonusQuestions[0];
              return { ...selectedBonus, key: `bonus-${bonusIndex}`, questionIndex: bonusIndex, isBonus: true };
            }
            const category = categories[Number(game.categoryIndex)];
            const question = category?.questions?.[Number(game.questionIndex)];
            if (!category || !question) return null;
            const level = Number(game.questionIndex);
            return {
              key: `${game.categoryIndex}-${game.questionIndex}`,
              categoryIndex: Number(game.categoryIndex),
              questionIndex: Number(game.questionIndex),
              category: category.name,
              level,
              value: Number(game.value || (level + 1) * 100),
              text: question[0],
              choices: question[1],
              answer: question[2],
              fact: question[3],
              isBonus: false
            };
          }

          function getNextBonusQuestion() {
            const count = bonusQuestions.length;
            const roundOffset = Math.max(0, currentRound() - 1) % count;
            let bonusIndex = roundOffset;

            for (let offset = 0; offset < count; offset += 1) {
              const candidate = (roundOffset + offset) % count;
              if (!currentUsed().has(`bonus-${candidate}`)) {
                bonusIndex = candidate;
                break;
              }
            }

            return {
              ...bonusQuestions[bonusIndex],
              key: `bonus-${bonusIndex}`,
              questionIndex: bonusIndex,
              isBonus: true
            };
          }'''
            ),
            (
              '''  $("displayBonus").addEventListener("click", () => startQuestion({ ...bonus, key: null, isBonus: true }));
            $("hostBonus").addEventListener("click", () => startQuestion({ ...bonus, key: null, isBonus: true }));''',
              '''  $("displayBonus").addEventListener("click", () => startQuestion(getNextBonusQuestion()));
            $("hostBonus").addEventListener("click", () => startQuestion(getNextBonusQuestion()));'''
            )
          ]

          for old, new in replacements:
              if old not in app:
                  raise SystemExit(f'Could not find expected app-live.js block: {old[:80]!r}')
              app = app.replace(old, new)

          removed = app.count('    [roomPath("answers")]: null,\n')
          if removed < 2:
              raise SystemExit(f'Expected two protected answers cleanup writes; found {removed}.')
          app = app.replace('    [roomPath("answers")]: null,\n', '')

          app_path.write_text(app)
          PY

      - name: Validate JavaScript
        run: |
          node --check app-live.js
          node --check questions-live.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-live.js questions-live.js
          git rm .github/workflows/fix-rounds-and-bonus.yml
          git commit -m "Fix fresh rounds and rotate DCC bonus questions"
          git push origin HEAD:main
